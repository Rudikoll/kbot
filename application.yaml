apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kbot
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/rudikoll/kbot.git
    targetRevision: develop
    path: helm/kbot

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
