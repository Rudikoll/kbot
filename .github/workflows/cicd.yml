name: KBOT CI/CD Pipeline

on:
  push:
    branches:
      - develop

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      repo: ${{ steps.meta.outputs.repo }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag
        id: meta
        run: |
          APP_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="${APP_VERSION}-${SHORT_SHA}"
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "version=${TAG}" >> $GITHUB_OUTPUT
          echo "repo=${REPO}" >> $GITHUB_OUTPUT
          echo "Generated tag: ${TAG}, repo: ${REPO}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.version }}-linux-amd64
            ghcr.io/${{ steps.meta.outputs.repo }}:latest
          build-args: |
            TARGETOS=linux
            TARGETARCH=amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-helm:
    name: Update Helm Chart Tag
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag in values.yaml
        run: |
          TAG="${{ needs.build-and-push.outputs.image_tag }}"
          sed -i "s/tag: .*/tag: \"${TAG}\"/" helm/values.yaml
          echo "Updated tag to: ${TAG}"

      - name: Commit updated values.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/values.yaml
          git commit -m "ci: update image tag to ${{ needs.build-and-push.outputs.image_tag }}" || echo "No changes to commit"
          git push
