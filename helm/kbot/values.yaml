replicaCount: 1

image:
  registry: "ghcr.io"
  repository: "den-vasyliev/kbot"
  tag: "v1.0.0-106879e"
  os: linux
  arch: amd64
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

env:
  - name: TELE_TOKEN
    valueFrom:
      secretKeyRef:
        name: kbot-secret
        key: token

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
